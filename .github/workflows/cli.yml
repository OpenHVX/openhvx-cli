name: CLI checks
on:
  push:
  pull_request:
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - run: git diff --check
  portable-builds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build portable binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/hvx-linux" ./cmd/hvx
          GOOS=darwin GOARCH=arm64 go build -o "$RUNNER_TEMP/hvx-macos" ./cmd/hvx
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/hvx.exe" ./cmd/hvx
